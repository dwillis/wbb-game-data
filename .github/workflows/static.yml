# Deploy the pre-built static site (site/) to GitHub Pages.
#
# The site is built LOCALLY by scripts/build_index.py + scripts/build_site.py
# and committed alongside the index — this repo is ~139 GB, far too large for a
# standard Actions runner to check out, so CI uses a blobless sparse clone of
# the site/ directory only and uploads it as the Pages artifact.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/static.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sparse-clone the site directory (blobless clone, no history)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo-clone
          cd repo-clone
          git sparse-checkout set site
          git checkout "${GITHUB_SHA}"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo-clone/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
